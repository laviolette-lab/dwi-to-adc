[package]
name = "dwi-to-adc"
version = "0.1.0"
edition = "2024"
description = "Convert diffusion-weighted MRI data to apparent diffusion coefficient maps"
license = "MIT"

[lib]
name = "dwi_to_adc"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "dwi-to-adc"
path = "src/main.rs"

[features]
default = []
python = ["dep:pyo3", "pyo3/abi3-py39"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dicom-core = "0.10"
dicom-dictionary-std = "0.10"
dicom-object = "0.10"
dicom-pixeldata = { version = "0.10", features = ["native", "ndarray"], default-features = false }
ndarray = "0.17"
nifti = { version = "0.18", features = ["ndarray_volumes"] }
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[package.metadata.maturin]
name = "dwi_to_adc._native"
features = ["python"]
